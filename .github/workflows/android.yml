# They are provided by a third-party and governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Flutter Test and Build (Android)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # 1. Flutter SDK 설정 (버전 변경)
      # Dart SDK 3.9.2를 지원하기 위해 Flutter 버전을 최신 안정화 버전으로 변경합니다.
      # 'flutter-version'을 제거하고 'channel: stable'만 남겨서 최신 버전을 자동으로 가져오도록 합니다.
      - name: Set up Flutter SDK (using latest stable version)
        uses: subosito/flutter-action@v2
        with:
          # flutter-version: 3.25.0 # 이 부분을 삭제하여 버전 결정 오류를 방지
          channel: 'stable' # 안정화 채널의 최신 버전을 사용합니다.

      - name: Get dependencies
        run: flutter pub get

      - name: Run unit/widget tests
        run: flutter test
        
      # 2. Android 빌드 실행
      # (옵션: --no-sound-null-safety는 구버전 지원 시 사용)
      - name: Build Debug APK
        run: flutter build apk --debug
        
      - name: Build Debug AppBundle
        run: flutter build appbundle --debug

      # 3. 아티팩트 업로드 (다운로드를 위해 필수 추가)
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          # 빌드된 APK의 기본 경로
          path: build/app/outputs/flutter-apk/app-debug.apk
          
      - name: Upload Debug AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          # 빌드된 AAB의 기본 경로
          path: build/app/outputs/bundle/debug/app-debug.aab
